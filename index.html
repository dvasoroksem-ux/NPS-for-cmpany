*{box-sizing:border-box}html,body{margin:0;padding:0}
body{font-family:'Loos Normal','Inter',system-ui,sans-serif;background:#EEF0F5;color:#101010;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
#app{display:flex;min-height:100vh}
.side{width:236px;flex:0 0 236px;background:#fff;border-right:1px solid #E7E6EE;padding:22px 16px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.side .logo{padding:4px 6px 20px}.side .logo img{width:100%;max-width:196px;height:auto;display:block}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:11px;color:#5C5A68;text-decoration:none;font-size:13.5px;font-weight:500;transition:.13s;cursor:pointer}
.nav a:hover{background:#F5F4F8;color:#101010}.nav a.on{background:#FFE7E5;color:#C21207}
.nav a .ic{width:17px;height:17px;flex:0 0 17px}
.side-foot{margin-top:auto;border-top:1px solid #EEEDF2;padding-top:14px}
.side-foot .row{display:flex;align-items:center;gap:10px}
.side-foot .av{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#F12411,#ff7a63);display:grid;place-items:center;flex:0 0 32px}
.side-foot .av img{height:16px}.side-foot b{font-size:13px;font-family:'Loos Wide','Space Grotesk'}.side-foot small{display:block;color:#9997A4;font-size:11px}
.side-foot .reset{width:100%;margin-top:12px;background:transparent;border:1px solid #E7E6EE;color:#8A8896;border-radius:9px;padding:7px;font-size:12px;cursor:pointer;font-family:inherit}
.main{flex:1;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;padding:22px 30px;border-bottom:1px solid #E7E6EE;background:rgba(255,255,255,.6);backdrop-filter:blur(8px);position:sticky;top:0;z-index:5}
.top h1{font-family:'Loos Wide','Space Grotesk';font-size:22px;margin:0;letter-spacing:-.02em}.top .sub{color:#8A8896;font-size:12.5px;margin-top:2px}
.wrap{padding:24px 30px 60px;max-width:1160px}
.btn{background:linear-gradient(135deg,#F12411,#ff6a52);color:#fff;border:none;padding:10px 16px;border-radius:11px;font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;box-shadow:0 8px 20px -8px rgba(228,50,43,.5);display:inline-flex;align-items:center;gap:7px}
.btn.ghost{background:#fff;color:#3A3846;border:1px solid #E4E2EC;box-shadow:none}.btn.dark{background:linear-gradient(135deg,#2A2622,#100F0E);box-shadow:0 8px 20px -8px rgba(20,18,17,.45)}
.btn.sm{padding:7px 12px;font-size:12.5px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}
.c{background:#fff;border-radius:18px;padding:18px 20px;box-shadow:0 1px 2px rgba(27,26,36,.03),0 12px 28px -12px rgba(27,26,36,.13)}
.c .ico{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;margin-bottom:12px}
.c .l{font-size:12.5px;color:#807E8C}.c .v{font-family:'Loos Wide','Space Grotesk';font-weight:700;font-size:30px;margin-top:5px;letter-spacing:-.02em}
.c .v small{font-size:15px;color:#B4B2C0}.c .dl{font-size:12px;margin-top:7px;font-weight:500}.c .dl.up{color:#12A56A}.c .dl.dn{color:#F12411}
.row2{display:grid;grid-template-columns:.85fr 1.15fr;gap:16px;margin-bottom:16px}
.row3{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.panel{background:#fff;border-radius:20px;padding:22px 24px;box-shadow:0 1px 2px rgba(27,26,36,.03),0 16px 34px -14px rgba(27,26,36,.14)}
.panel h3{font-family:'Loos Wide','Space Grotesk';font-size:15.5px;margin:0 0 3px;letter-spacing:-.01em}.panel .ph{font-size:12.5px;color:#8A8896;margin-bottom:18px}
.split{display:flex;align-items:center;gap:26px}
.ringwrap{position:relative;flex:0 0 auto}.ringwrap .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringwrap .ctr .n{font-family:'Loos Wide','Space Grotesk';font-weight:700;font-size:32px}.ringwrap .ctr .n small{font-size:13px;color:#B4B2C0}.ringwrap .ctr .cc{font-size:11px;color:#8A8896}
.lgd .li{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid #F1F0F5;font-size:13px}.lgd .li:last-child{border:none}.lgd .li i{width:11px;height:11px;border-radius:4px}.lgd .li b{margin-left:auto;font-family:'Loos Wide','Space Grotesk'}
.bar{display:flex;align-items:center;gap:12px;padding:8px 0}.bar .bl{width:160px;font-size:13px}.bar .bt{flex:1;height:9px;background:#F0EEF4;border-radius:6px;overflow:hidden}.bar .bt i{display:block;height:100%;border-radius:6px}.bar .bv{width:40px;text-align:right;font-family:'Loos Wide','Space Grotesk';font-weight:600;font-size:13px;color:#3A3846}
.who{display:flex;align-items:center;gap:11px}.avm{width:34px;height:34px;border-radius:11px;background:#F1EFF5;display:grid;place-items:center;font-weight:700;font-family:'Loos Wide','Space Grotesk';color:#5C5A6B;font-size:12.5px;flex:0 0 34px;overflow:hidden}
.comment{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #F1F0F5}.comment:last-child{border:none}.comment .d{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:0 0 8px}.comment .m{font-size:11.5px;color:#9997A4}.comment .x{font-size:13.5px;margin-top:2px}
.tbl{width:100%;border-collapse:collapse}.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:#A6A4B0;font-weight:600;padding:10px 14px;border-bottom:1px solid #EFEEF3}
.tbl td{padding:13px 14px;border-bottom:1px solid #F4F3F7;font-size:13.5px}.tbl tr:last-child td{border:none}.tbl tr.cl:hover{background:#FAFAFC;cursor:pointer}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:20px;font-size:12.5px;font-weight:600;font-family:'Loos Wide','Space Grotesk'}
.pill.g{background:#E5F5EE;color:#0E7E52}.pill.a{background:#FCF3DC;color:#9A7300}.pill.r{background:#FFE7E5;color:#C21207}.pill.n{background:#F1F0F5;color:#8A8896}
.pill.client{background:#FFE7E5;color:#C21207}.pill.i360,.pill.enps{background:#ECEAE8;color:#3A3330}

/* ---- state ---- */
let DB=null,VIEW='dashboard',PARAM=null,NF={kind:'client',project:'',subject:''},ANS={},ERR=[],sent=false,curForm=null;
function linkFor(t){return location.origin+location.pathname+'#f='+t}
function route(){const m=(location.hash||'').match(/#f=([a-z0-9_]+)/i);if(!m)return false;const f=(DB.forms||[]).find(x=>x.token===m[1]);if(f){curForm=f;ANS={};ERR=[];sent=false;VIEW='respond';render();return true}document.getElementById('app').innerHTML='<div class="resp"><div class="rc"><div class="card" style="text-align:center;padding:40px"><h2 class="ft">Форма недоступна</h2><p style="color:#8A8896;font-size:13.5px">Похоже, ссылка открыта на устройстве без доступа к данным. Чтобы ссылки работали у всех, нужна общая база данных — это следующий шаг.</p></div></div></div>';return true}
async function init(){initSB();
  if(sb){try{let st=await sbLoadState();if(!st){const sd=seed();st={team:sd.team,projects:sd.projects,leaders:sd.leaders,forms:sd.forms,meta:sd.meta};await sbSaveState(st)}DB={...st,responses:await sbLoadResponses()}}catch(e){console.error('Supabase',e);DB=await dbGet()||seed()}}
  else{DB=await dbGet();if(!DB){DB=seed();await dbSet(DB)}}
  if(!route())render();window.addEventListener('hashchange',()=>{if(!route())render()})}
async function persist(){if(sb){try{await sbSaveState({team:DB.team,projects:DB.projects,leaders:DB.leaders,forms:DB.forms,meta:DB.meta})}catch(e){console.error(e)}}else{await dbSet(DB)}}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1900)}
function val(id){const e=document.getElementById(id);return e?e.value.trim():''}

/* ---- calc ---- */
function avg(a){a=a.filter(v=>v!=null);return a.length?a.reduce((x,y)=>x+y,0)/a.length:null}
function byKind(k){return DB.responses.filter(r=>r.kind===k)}
function fAvg(rs,id){return avg(rs.map(r=>r.ratings&&r.ratings[id]))}
function barColor(v){return v==null?'#DDD':v>=4.3?'#12A56A':v>=3.6?'#E0A106':'#F12411'}
function projResp(pid){return DB.responses.filter(r=>r.kind==='client'&&r.project===pid)}
function memb360(mid){return DB.responses.filter(r=>r.kind==='i360'&&r.subject===mid)}
function memb360Avg(mid){const rs=memb360(mid);return {avg:avg(rs.flatMap(r=>I360.map(id=>r.ratings[id]))),n:rs.length}}
function enpsScore(){const vals=byKind('enps').flatMap(r=>Object.values(r.ratings||{})).filter(v=>typeof v==='number');return vals.length?avg(vals):null}
function sentR(v,max){if(max===10)return v>=9?'g':v>=7?'a':'r';return v>=4.3?'g':v>=3.5?'a':'r'}

/* ---- svg ---- */
function ring(frac,size,st,col){const r=(size-st)/2,c=2*Math.PI*r,dash=(frac||0)*c;return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><g transform="rotate(-90 ${size/2} ${size/2})"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#F0EEF4" stroke-width="${st}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="${st}" stroke-linecap="round" stroke-dasharray="${dash} ${c-dash}"/></g></svg>`}
function donut(vals,cols,size,st){const r=(size-st)/2,c=2*Math.PI*r,tot=vals.reduce((a,b)=>a+b,0)||1;let off=0,s='';vals.forEach((v,i)=>{const l=v/tot*c;s+=`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${cols[i]}" stroke-width="${st}" stroke-dasharray="${l} ${c-l}" stroke-dashoffset="${-off}" stroke-linecap="round"/>`;off+=l});return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><g transform="rotate(-90 ${size/2} ${size/2})">${s}</g></svg>`}
function barsHtml(list){return list.map(([l,v])=>`<div class="bar"><div class="bl">${l}</div><div class="bt"><i style="width:${v?v/5*100:0}%;background:${barColor(v)}"></i></div><div class="bv">${v?v.toFixed(1):'—'}</div></div>`).join('')}

function shell(title,sub,body,action=''){
  return `<aside class="side"><div class="logo"><img src="${LOGOH}"></div><nav class="nav">${NAV.map(([v,l,ic])=>`<a class="${VIEW===v?'on':''}" onclick="nav('${v}')"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${ic}"/></svg>${l}</a>`).join('')}</nav>

function vDash(){
  const cr=byKind('client');const clientAvg=fAvg(cr,'team');
  const teamAvg=avg(byKind('i360').flatMap(r=>I360.map(id=>r.ratings[id])));
  const en=enpsScore();
  const teamVals=cr.map(r=>r.ratings.team).filter(v=>v!=null);

/* ---- respondent (standalone) ---- */
function hearts(id,ac){const v=ANS[id]||0;let h='<div class="hearts">';for(let i=1;i<=5;i++){const on=i<=v;h+=`<button type="button" class="hcol ${on?'on':''}" onclick="setV('${id}',${i})"><span class="hn">${i}</span><svg viewBox="0 0 24 24" width="32" height="32" fill="${on?ac:'none'}" stroke="${on?ac:'#CFCDD8'}" stroke-width="1.7" stroke-linejoin="round"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54z"/></svg></button>`}return h+'</div>'}
function scale5(it){const v=ANS[it.id];let b='';for(let i=1;i<=5;i++)b+=`<button type="button" class="${v===i?'on':''}" onclick="setV('${it.id}',${i})">${i}</button>`;return `<div class="scalerow">${it.left?`<span class="anch">${it.left}</span>`:''}<div class="s5">${b}</div>${it.right?`<span class="anch" style="text-align:right">${it.right}</span>`:''}</div>`}
function npsBtns(id){const v=ANS[id];let b='';for(let i=0;i<=10;i++)b+=`<button type="button" class="${v===i?'on':''}" onclick="setV('${id}',${i})">${i}</button>`;return `<div class="npsrow">${b}</div><div style="display:flex;justify-content:space-between;font-size:11px;color:#A6A4B0;margin-top:7px"><span>Точно нет</span><span>Точно да</span></div>`}
function esc(s){return (s||'').replace(/"/g,'&quot;').replace(/</g,'&lt;')}
function ritem(it,ac){
  if(it.t==='section')return `<div class="section"><div class="st">${it.n?`<span class="qn">${it.n}.</span>`:''}${it.title}</div>${it.note?`<div class="snote">(${it.note})</div>`:''}</div>`;
  const err=ERR.includes(it.id);
  const lbl=`<label class="ql">${it.n?`<span class="qn">${it.n}.</span>`:''}${it.sub?`<span class="qn">${it.sub})</span>`:''}${it.q} <span class="req">*</span>${it.note?`<span class="note">(${it.note})</span>`:''}</label>`;
  let ctrl='';
  if(it.t==='heart')ctrl=hearts(it.id,ac);else if(it.t==='scale5')ctrl=scale5(it);else if(it.t==='nps')ctrl=npsBtns(it.id);
  else if(it.t==='email'||it.t==='text'||it.t==='just')ctrl=`<input class="tin" style="border:none;border-bottom:1.5px solid #E4E2EC;border-radius:0;background:transparent;padding:9px 2px" placeholder="Ответ" value="${esc(ANS[it.id])}" oninput="setText('${it.id}',this.value)">`;
  else if(it.t==='textbig')ctrl=`<textarea placeholder="Ответ…" oninput="setText('${it.id}',this.value)">${esc(ANS[it.id])}</textarea>`;
  return `<div class="q ${it.sub?'sub-q':''} ${it.t==='just'?'just':''} ${err?'err':''}">${lbl}${ctrl}${err?'<div class="errmsg">Пожалуйста, заполните это поле</div>':''}</div>`;
}
function vRespond(){
  const f=curForm,t=TEMPLATES[f.kind],subj=f.subject?DB.team.find(m=>m.id===f.subject):null,proj=f.project?DB.projects.find(p=>p.id===f.project):null;
  if(sent)return `<div class="resp"><div class="rc"><div class="card"><div class="thanks"><div class="big" style="background:${f.kind==='client'?'linear-gradient(135deg,#F12411,#ff6a52)':'linear-gradient(135deg,#2A2622,#100F0E)'}">✓</div><h2>Спасибо за оценку!</h2><p>Ответ сохранён и уже влияет на статистику.</p><button class="btn ghost" onclick="nav('forms')">← В систему (демо)</button></div></div></div></div>`;
  let inner=`<div class="card"><div class="fhead"><img class="flogo" src="${LOGOH}"><span class="pill ${f.kind}">${f.kind==='client'?'Оценка для партнёра':'Внутренний опрос'}</span></div><div class="fhr"></div><h2 class="ft">${t.title}${subj?' — '+subj.name:''}</h2>`;
  if(proj)inner+=`<div style="font-size:13px;color:#8A8896">Проект: <b>${proj.name}</b></div>`;
  inner+=`<div class="intro">${t.intro}</div>`;
  if(t.anon)inner+=`<div class="anon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 018 0v3"/></svg> Опрос анонимный · ответ не виден коллеге</div>`;
  if(t.legend)inner+=`<div class="legend"><div class="lt">шкала оценок</div>${t.legend.map(l=>`<div class="lr"><b>${l[0]}</b><span>— ${l[1]}</span></div>`).join('')}</div>`;
  inner+=`<div class="reqnote">Все поля обязательны для заполнения</div>`+t.fields.map(it=>ritem(it,t.accent)).join('');
  inner+=`<button class="submit ${f.kind}" onclick="submitForm()">Отправить</button><div class="foot">Отдельная страница для получателя.${t.anon?' Ответы анонимны.':''} Доступа к другим данным нет.</div></div>`;
  return `<div class="resp"><div class="rc"><a onclick="nav('forms')" style="color:#8A8896;font-size:13px;cursor:pointer;display:block;margin-bottom:12px">← назад (демо)</a>${inner}</div></div>`;
}

/* ---- actions ---- */
function nav(v,p=null){VIEW=v;PARAM=p;if(v!=='respond'){ANS={};ERR=[];sent=false}try{if(location.hash)history.replaceState(null,'',location.pathname)}catch(e){}render();window.scrollTo(0,0)}
function setV(k,v){ANS[k]=v;ERR=ERR.filter(e=>e!==k);const y=window.scrollY;render();window.scrollTo(0,y)}
function setText(k,v){ANS[k]=v}
function render(){try{document.getElementById('app').innerHTML=VIEW==='respond'?vRespond():({dashboard:vDash,projects:vProjects,team:vTeam,forms:vForms}[VIEW]||vDash)()}catch(e){console.error(e);document.getElementById('app').innerHTML='<div style="padding:40px;font-family:sans-serif;color:#101010"><b>Что-то пошло не так.</b><br>Обновите страницу или нажмите «Сбросить демо-данные».</div>'}}
async function createProject(){const n=val('np_name');if(!n){toast('Введите название');return}DB.projects.push({id:uid('pr'),name:n,client:val('np_client')||'—',team:[],status:'Активен'});NF.newProj=false;await persist();toast('Проект создан');render()}
function ensureProject(name){const n=name.trim();let p=DB.projects.find(x=>x.name.toLowerCase()===n.toLowerCase());if(!p){p={id:uid('pr'),name:n,client:n,team:[],status:'Активен'};DB.projects.push(p)}return p.id}
function ensureMember(name){const n=name.trim();let m=DB.team.find(x=>x.name.toLowerCase()===n.toLowerCase());if(!m){m={id:uid('m'),name:n,role:'—'};DB.team.push(m)}return m.id}
async function createForm(kind){let project=null,subject=null;
  if(kind==='client'){const nm=val('cf_proj');if(!nm){toast('Впишите проект или партнёра');return}project=ensureProject(nm)}
  const f={id:uid('form'),kind,project,subject,token:uid('tok'),created:Date.now()};DB.forms.push(f);await persist();try{navigator.clipboard&&navigator.clipboard.writeText(linkFor(f.token))}catch(e){}toast('Форма создана — ссылка скопирована');render()}
function quickForm(kind,project){const f={id:uid('form'),kind,project:project||null,subject:null,token:uid('tok'),created:Date.now()};DB.forms.push(f);persist();try{navigator.clipboard&&navigator.clipboard.writeText(linkFor(f.token))}catch(e){}toast('Форма создана — ссылка скопирована');nav('forms')}
function copyLink(tok){try{navigator.clipboard&&navigator.clipboard.writeText(linkFor(tok))}catch(e){}toast('Ссылка скопирована')}
async function closeForm(id){DB.forms=DB.forms.filter(f=>f.id!==id);await persist();toast('Форма закрыта');render()}
function preview(id){curForm=DB.forms.find(f=>f.id===id);ANS={};ERR=[];sent=false;VIEW='respond';render();window.scrollTo(0,0)}
function isEmpty(it){const v=ANS[it.id];if(it.t==='heart'||it.t==='scale5'||it.t==='nps')return v==null;return !(typeof v==='string'&&v.trim().length)}
async function submitForm(){const t=TEMPLATES[curForm.kind];ERR=t.fields.filter(it=>it.t!=='section'&&isEmpty(it)).map(it=>it.id);
  if(ERR.length){render();const e=document.querySelector('.q.err');if(e)e.scrollIntoView({behavior:'smooth',block:'center'});return}
  const ratings={},texts={};t.fields.forEach(it=>{if(['heart','scale5','nps'].includes(it.t))ratings[it.id]=ANS[it.id];else if(it.t!=='section')texts[it.id]=ANS[it.id]});
  const _resp={id:uid('r'),form:curForm.id,kind:curForm.kind,project:curForm.project,subject:curForm.subject,ratings,texts,date:Date.now()};
  DB.responses.push(_resp);
  if(sb){try{await sbInsertResponse(_resp)}catch(e){console.error(e)}}else{await persist()}
  sent=true;render();window.scrollTo(0,0)}
async function resetApp(){if(!confirm('Сбросить все данные к демо-набору?'))return;DB=seed();await persist();nav('dashboard');toast('Данные сброшены')}
async function runAI(){const b=document.getElementById('aibtn'),box=document.getElementById('aires');
  const cs=[];DB.responses.forEach(r=>{if(r.texts)Object.values(r.texts).forEach(x=>{if(x&&typeof x==='string'&&x.length>4)cs.push(x)})});
  if(!cs.length){box.innerHTML='<div style="font-size:13px;color:#9997A4">Анализ появится, когда в анкетах будут текстовые ответы. Сейчас данных для разбора нет.</div>';return}
  b.disabled=true;b.innerHTML='<span class="spinner"></span>';box.innerHTML='<div style="font-size:13px;color:#9997A4;padding:6px 0">Claude читает '+cs.length+' комментариев…</div>';
  const prompt=`Ты аналитик партнёрского опыта в агентстве 247. Проанализируй отзывы (RU). Верни СТРОГО JSON без markdown: {"summary":"2-3 предложения","sentiment":{"positive":N,"neutral":N,"negative":N},"themes":["тема"],"recommendations":["действие"]}\nОтзывы:\n${cs.join('\n')}`;
  try{const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,messages:[{role:'user',content:prompt}]})});
    const d=await r.json();let tx=(d.content||[]).map(x=>x.type==='text'?x.text:'').join('').trim().replace(/```json|```/g,'').trim();let ai;try{ai=JSON.parse(tx)}catch(e){ai={raw:tx}}
    let h='';if(ai.summary)h+=`<div class="ai-block"><h4>Сводка</h4><div style="font-size:13.5px;line-height:1.55">${ai.summary}</div></div>`;
    if(ai.sentiment)h+=`<div class="ai-block"><h4>Тональность</h4><div class="chiprow"><span class="chip" style="background:#E5F5EE;color:#0E7E52">Позитив ${ai.sentiment.positive??'–'}</span><span class="chip" style="background:#FCF3DC;color:#9A7300">Нейтрал ${ai.sentiment.neutral??'–'}</span><span class="chip" style="background:#FFE7E5;color:#C21207">Негатив ${ai.sentiment.negative??'–'}</span></div></div>`;
    if(ai.themes)h+=`<div class="ai-block"><h4>Темы</h4><div class="chiprow">${ai.themes.map(x=>`<span class="chip">${x}</span>`).join('')}</div></div>`;
    if(ai.recommendations)h+=`<div class="ai-block"><h4>Рекомендации</h4><ul style="margin:0;padding-left:18px;font-size:13px;line-height:1.6">${ai.recommendations.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
    box.innerHTML=h||`<div style="font-size:13.5px;white-space:pre-wrap">${ai.raw||''}</div>`;
  }catch(e){box.innerHTML='<div style="font-size:13px;color:#9997A4">ИИ-анализ здесь работает при наличии ответов. На внешнем хостинге он подключается вместе с базой данных (следующий шаг).</div>'}
  b.disabled=false;b.textContent='Проанализировать'}
window.nav=nav;window.setV=setV;window.setText=setText;window.createProject=createProject;window.createForm=createForm;window.quickForm=quickForm;window.copyLink=copyLink;window.closeForm=closeForm;window.preview=preview;window.submitForm=submitForm;window.resetApp=resetApp;window.runAI=runAI;window.NF=NF;
init();
</script>
